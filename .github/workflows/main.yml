name: Analyze Touhou Little Maid Farming Logic

# 允许你随时在 Actions 页面手动点击运行
on: 
  workflow_dispatch:

jobs:
  analyze_tlm_source:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载车万女仆 1.12.2 源码
        run: |
          wget -O tlm_1.12.2.zip https://github.com/TartaricAcid/TouhouLittleMaid/archive/refs/heads/1.12.2.zip

      - name: 📦 解压源码
        run: unzip -q tlm_1.12.2.zip

      - name: 🔍 检索并打印“所有农田相关类”的路径
        run: |
          cd TouhouLittleMaid-1.12.2
          echo "====================================================="
          echo " 找到的女仆种地逻辑文件如下："
          echo "====================================================="
          find src/main/java/com/github/tartaricacid/touhoulittlemaid/entity/task src/main/java/com/github/tartaricacid/touhoulittlemaid/entity/ai -type f -iname "*farm*" -o -iname "*plant*" -o -iname "*harvest*"

      - name:  提取核心排序逻辑 (解决“从边缘开始种地”)
        run: |
          cd TouhouLittleMaid-1.12.2
          echo " 女仆是如何基于距离找耕地的 (距离权重排序) :"
          # 提取包含 distanceSq, sort 或 Comparator 的农夫逻辑代码行
          grep -rnw -E "distanceSq|sort|Comparator" src/main/java/com/github/tartaricacid/touhoulittlemaid/entity/task | grep -i "farm\|plant\|harvest" | head -n 15 || true

      - name:  提取耕地/成熟度判断逻辑 
        run: |
          cd TouhouLittleMaid-1.12.2
          echo "====================================================="
          echo " 女仆是如何精准识别作物和耕地的 :"
          echo "====================================================="
          # 提取作物年龄(AGE)、方块判断(BlockCrops/Farmland)的核心代码行
          grep -rnw -E "BlockCrops|AGE|isMaxAge|Farmland|canSustainPlant" src/main/java/com/github/tartaricacid/touhoulittlemaid/entity/task | head -n 15 || true
