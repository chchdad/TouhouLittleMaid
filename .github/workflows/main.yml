name: Analyze TLM Farming Logic (Local Repo)

on: 
  workflow_dispatch:

jobs:
  analyze_tlm_source:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 🔍 动态定位农夫逻辑文件
        run: |
          find . -type f -name "*.java" | grep -iE "farm|plant|harvest" || true

      - name: 💡 提取核心排序逻辑 
        run: |

          TARGET_FILES=$(find . -type f -name "*.java" | grep -iE "farm|plant|harvest")
          if [ -n "$TARGET_FILES" ]; then
            grep -rn -E "distanceSq|sort|Comparator|getDistance" $TARGET_FILES | grep -v "import" | head -n 20 || true
          else
            echo "未找到目标文件"
          fi

      - name: 💡 提取耕地/成熟度判断逻辑 
        run: |

          TARGET_FILES=$(find . -type f -name "*.java" | grep -iE "farm|plant|harvest")
          if [ -n "$TARGET_FILES" ]; then
            grep -rn -E "BlockCrops|AGE|isMaxAge|Farmland|canSustainPlant|isUnfarmed" $TARGET_FILES | grep -v "import" | head -n 20 || true
          else
            echo "未找到目标文件"
          fi
